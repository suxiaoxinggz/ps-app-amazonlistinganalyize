server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Frontend-owned template download route.
    location = /api/template {
        proxy_pass http://frontend:3179;
    }

    # Backend API routes.
    location ^~ /api/ {
        proxy_pass http://backend:8723;
    }

    location ~ ^/(upload|analyze|project|admin|gateway|template)(/|$) {
        proxy_pass http://backend:8723;
    }

    # Everything else is the Next.js frontend.
    location / {
        proxy_pass http://frontend:3179;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
