services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: listing-backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    restart: always
    environment:
      - PORT=8000
      - GATEWAY_API_KEY
      - ADMIN_PASSWORD
      - BACKEND_CORS_ORIGINS

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty default means browser calls same-origin paths such as /analyze.
        # Set NEXT_PUBLIC_API_URL in .env only if backend is on a separate origin.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
    container_name: listing-frontend
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NODE_ENV=production
