version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: listing-backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
    restart: always
    environment:
      - PORT=8000
      - GATEWAY_API_KEY

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.mistorify.com
    container_name: listing-frontend
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NODE_ENV=production
