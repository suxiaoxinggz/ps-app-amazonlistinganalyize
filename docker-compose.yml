services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: listing-backend
    expose:
      - "8723"
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      - ./hf_cache:/app/.cache/huggingface
    restart: always
    environment:
      - PORT=8723
      - GATEWAY_API_KEY
      - ADMIN_PASSWORD
      - BACKEND_CORS_ORIGINS
      - HF_HOME=/app/.cache/huggingface
      - EMBEDDING_MODEL
      - EMBEDDING_NORMALIZE
      - SENTIMENT_MODEL

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty default means browser calls same-origin paths such as /analyze.
        # Set NEXT_PUBLIC_API_URL in .env only if backend is on a separate origin.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
    container_name: listing-frontend
    expose:
      - "3179"
    restart: always
    environment:
      - NODE_ENV=production

  gateway:
    image: nginx:1.27-alpine
    container_name: listing-gateway
    depends_on:
      - frontend
      - backend
    ports:
      - "${APP_PORT:-18080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
